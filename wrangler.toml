# Cloudflare Pages configuration for BlueKnight Panel 5.2.7
# The Pages project name in the Cloudflare dashboard must match `name` below.
name = "blueknight-panel"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Pre-bind the existing Cloudflare KV namespace before the first deployment.
[[kv_namespaces]]
binding = "BK_KV"
id = "6bf7af8d12784b37b00d9189c298e75b"
